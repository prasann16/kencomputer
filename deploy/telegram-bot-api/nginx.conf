# In front of Telegram's own Bot API server (telegram-bot-api --local): one door for ken-hosted, which alone knows the
# relay secret. /bot<token>/<method> goes to the server as is; /file/bot<token>/<path> serves a file the server saved,
# only from that bot's own folder. Files up to 2 GB, both ways.
# The Bot API server keeps its files readable only by itself; the door reads them (read-only mount) as root.
user root;
worker_processes auto;
events { worker_connections 1024; }
http {
  sendfile on;
  client_max_body_size 2000m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  server {
    listen 8080;
    if ($http_x_ken_relay != "${KEN_RELAY_SECRET}") { return 403; }
    # A file: getFile hands out its full path on the server, which comes back here after /file/bot<token>/. Only that
    # same bot's folder (\1), one folder deep, a plain file name: nothing else can be reached.
    location ~ "^/file/bot(?<tok>[0-9]+:[A-Za-z0-9_-]+)/+var/lib/telegram-bot-api/\1/(?<sub>[a-z_]+)/(?<fname>[A-Za-z0-9_.-]+)$" {
      alias /var/lib/telegram-bot-api/$tok/$sub/$fname;
    }
    location /file/ { return 404; }
    location ~ ^/bot[0-9]+:[A-Za-z0-9_-]+/ {
      proxy_pass http://bot-api:8081;
      proxy_request_buffering off;
    }
    location / { return 404; }
  }
}
