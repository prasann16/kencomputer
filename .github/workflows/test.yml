# Every change is tested before it can merge: unit tests, and Ken's native parts
# load and decode a voice note, on the exact locked versions users get.
name: Test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          uv venv -q --seed --managed-python --python 3.13 .venv
          uv pip install -q --python .venv/bin/python -r requirements.txt pytest pytest-asyncio pytest-aiohttp
          tests/check.sh
