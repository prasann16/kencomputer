name: Publish beta
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version, e.g. v0.1.22-beta.1 (empty = next beta)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: macos-15
    concurrency: release-preparation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run Publish beta from main"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for main checks
        timeout-minutes: 15
        run: bash .github/scripts/wait-for-main-tests.sh "$GITHUB_SHA"
      - name: Tag and start the beta build
        run: |
          tag="$(python3 desktop/release_version.py beta "$REQUESTED_VERSION")"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [ "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" ] || { echo "::error::$tag already belongs to another commit"; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Ken for Mac ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          gh workflow run release.yml --ref "$tag" -f publish_beta=true
          echo "### Beta $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "The [release build](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml) will publish a GitHub prerelease after the signed builds and Mac install/update checks pass." >> "$GITHUB_STEP_SUMMARY"
