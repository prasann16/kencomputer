# Install an older Apple Silicon release on a real M-series Mac, close its window, and watch the auto-update.
name: M1 check
on: { push: { branches: [m1-check] } }
jobs:
  m1:
    runs-on: macos-15
    steps:
      - run: |
          gh release download v0.1.12 --repo prasann16/kencomputer -p Ken-arm64.dmg
          hdiutil attach -nobrowse -quiet Ken-arm64.dmg -mountpoint /tmp/kendmg
          cp -R /tmp/kendmg/Ken.app /Applications/ && hdiutil detach -quiet /tmp/kendmg
          xattr -d com.apple.quarantine /Applications/Ken.app 2>/dev/null || true
          open /Applications/Ken.app
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: |
          set +e; mkdir -p shots
          sleep 30
          osascript -e 'tell application "System Events" to tell process "Ken" to keystroke "w" using command down'
          for i in $(seq 1 48); do
            v=$(defaults read /Applications/Ken.app/Contents/Info.plist CFBundleShortVersionString)
            echo "== $((i*10))s app=$v pids: $(pgrep -f 'MacOS/Ken$' | tr '\n' ' ') engine: $(pgrep -f 'engine/ken-engine$' | tr '\n' ' ')"
            screencapture -x shots/$i.png; sleep 10
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: shots, path: shots }
      - if: always()
        run: |
          set +e
          for f in ~/.ken/logs/*; do echo "===== $f"; tail -100 "$f"; done
          echo "===== updater"; ls -la ~/Library/Caches/ken-desktop-updater 2>&1
          echo "===== ShipIt"; find ~/Library/Caches -path "*ShipIt*" -name "*.log" -exec tail -60 {} \; 2>/dev/null
          echo "===== electron main log"; find ~/Library/Logs -iname "*ken*" -exec tail -80 {} \; 2>/dev/null
