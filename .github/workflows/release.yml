# A tag like v0.1.2 → signed, notarized Ken for Apple Silicon and Intel as a draft GitHub
# Release. Then, on a Mac: desktop/check-release.sh v0.1.2 --publish
# (it tests the real download with a chat message and a voice note, and publishes if they pass).
name: Release Mac app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # the weekly update starts it this way, on the tag it made

jobs:
  engine:
    # The Python engine is native code, so each arch builds on its own kind of Mac.
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # uv's Python carries its own OpenSSL, and requirements.txt pins every part.
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv -q --seed --managed-python --python 3.13 .venv
          uv pip install -q --python .venv/bin/python -r requirements.txt pyinstaller==6.22.3
          .venv/bin/python desktop/build_engine.py
      # Stop the release if the bundled engine can't load a native part or decode a voice note.
      - run: dist/engine-${{ matrix.arch }}/ken-engine/ken-engine -c "exec(open('desktop/checks/parts.py').read())"
      - run: tar -czf engine-${{ matrix.arch }}.tgz -C dist engine-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: engine-${{ matrix.arch }}.tgz

  app:
    needs: engine
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true
      - run: |
          case "$GITHUB_REF_NAME" in v[0-9]*) ;; *) echo "Run this on a version tag, not $GITHUB_REF_NAME"; exit 1 ;; esac
          mkdir -p dist
          for a in arm64 x64; do tar -xzf engine-$a.tgz -C dist; done
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          # Create the draft first: both arches finish together and would otherwise each make one.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "Ken for Mac ${GITHUB_REF_NAME#v}"
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          npx electron-builder --mac --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The draft on a real M-series Mac: a fresh install must start, and the installed app must
  # update itself (fed a local copy of its own build as a "newer" version) and come back with
  # its engine. A build that fails here stays a draft: check-release.sh refuses to publish it.
  m1:
    needs: app
    runs-on: macos-15
    permissions:
      contents: write  # drafts are only visible with write access
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p Ken-arm64.dmg -p Ken-arm64.zip
          hdiutil attach -nobrowse -quiet Ken-arm64.dmg -mountpoint /tmp/kendmg
          cp -R /tmp/kendmg/Ken.app /Applications/ && hdiutil detach -quiet /tmp/kendmg
          mkdir -p feed && mv Ken-arm64.zip feed/
          printf 'version: 99.0.0\nfiles:\n  - url: Ken-arm64.zip\n    sha512: %s\n    size: %s\npath: Ken-arm64.zip\nsha512: %s\n' \
            "$(openssl dgst -sha512 -binary feed/Ken-arm64.zip | base64)" "$(stat -f %z feed/Ken-arm64.zip)" "$(openssl dgst -sha512 -binary feed/Ken-arm64.zip | base64)" > feed/latest-mac.yml
          cp feed/latest-mac.yml .  # kept for the failed-install check below
          (cd feed && python3 -m http.server 8765 >/dev/null 2>&1 &)
          mkdir -p ~/.ken/desktop-data && touch ~/.ken/desktop-data/updated   # start hidden, as after an update: a downloaded update then installs at once
          KEN_UPDATE_URL=http://127.0.0.1:8765 nohup /Applications/Ken.app/Contents/MacOS/Ken > ~/app.log 2>&1 &
          echo "first=$!" >> "$GITHUB_ENV"
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: |
          set +e; mkdir -p shots; fresh=0; updated=0
          for i in $(seq 1 36); do
            ken="$(pgrep -f 'MacOS/Ken$' | tr '\n' ' ')"; engine="$(pgrep -f 'engine/ken-engine$' | tr '\n' ' ')"
            answers="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7777/)"
            echo "== $((i*10))s ken: $ken engine: $engine installer: $(pgrep -x ShipIt | tr '\n' ' ') engine answers: $answers"
            screencapture -x shots/$i.png
            [ "$fresh" = 0 ] && [ "$answers" != 000 ] && fresh=1 && echo "fresh install runs"
            pgrep -x ShipIt >/dev/null && rm -f feed/latest-mac.yml   # one update is enough
            [ "$fresh" = 1 ] && [ -n "$ken" ] && [ "$ken" != "$first " ] && [ "$answers" != 000 ] && [ ! -f ~/.ken/desktop-data/update-failed ] && updated=1 && echo "updated and came back" && break
            sleep 10
          done
          [ "$fresh" = 1 ] || { echo "::error::a fresh install never answered"; exit 1; }
          [ "$updated" = 1 ] || { echo "::error::the app did not come back after updating itself"; exit 1; }
      # An update the installer can't finish must end with Ken back on screen asking for a
      # download, never with Ken gone. The moment Ken quits to install, Ken.app is locked in
      # place, so the installer can't replace it and gives up.
      - run: |
          set +e
          pkill -x Ken; for i in $(seq 1 20); do pgrep -x Ken >/dev/null || break; sleep 1; done; pkill -9 -x Ken; sleep 2
          rm -f ~/.ken/desktop-data/installing ~/.ken/desktop-data/update-failed
          cp latest-mac.yml feed/  # the same valid build as 99.0.0 again
          touch ~/.ken/desktop-data/updated
          KEN_UPDATE_URL=http://127.0.0.1:8765 nohup /Applications/Ken.app/Contents/MacOS/Ken > ~/app2.log 2>&1 &
          second=$!; gone=0; back=0
          (while kill -0 "$second" 2>/dev/null; do sleep 0.2; done; chflags uchg /Applications/Ken.app; echo "Ken.app locked"; sleep 40; chflags nouchg /Applications/Ken.app; echo "Ken.app unlocked") &
          for i in $(seq 1 36); do
            ken="$(pgrep -x Ken | tr '\n' ' ')"
            echo "== $((i*10))s ken: $ken installer: $(pgrep -x ShipIt | tr '\n' ' ') failed: $(cat ~/.ken/desktop-data/update-failed 2>/dev/null)"
            screencapture -x shots/failed-$i.png
            [ "$gone" = 0 ] && ! kill -0 "$second" 2>/dev/null && gone=1 && echo "quit to install"
            [ "$gone" = 1 ] && [ -n "$ken" ] && [ -f ~/.ken/desktop-data/update-failed ] && back=1 && echo "came back and asked for a download" && break
            sleep 10
          done
          chflags nouchg /Applications/Ken.app 2>/dev/null
          [ "$gone" = 1 ] || { echo "::error::Ken never quit to install the update"; exit 1; }
          [ "$back" = 1 ] || { echo "::error::after a failed install, Ken did not come back and ask for a download"; exit 1; }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: m1-shots, path: shots }
      - if: always()
        run: |
          set +e
          echo "===== app log"; cat ~/app.log; echo "===== app log, broken update"; cat ~/app2.log
          for f in ~/.ken/logs/*; do echo "===== $f"; tail -40 "$f"; done
          echo "===== installer logs"; for f in ~/Library/Caches/*ShipIt*/*.log; do echo "--- $f"; tail -40 "$f"; done
