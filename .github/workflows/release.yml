# Push a tag like v0.1.0 → signed, notarized Ken for Apple Silicon and Intel as a draft GitHub
# Release. Check the draft, then publish it: installed apps update to it within a few hours.
name: Release Mac app
on:
  push:
    tags: ["v*"]

jobs:
  engine:
    # The Python engine is native code, so each arch builds on its own kind of Mac.
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pyinstaller
          .venv/bin/python desktop/build_engine.py
          tar -czf engine-${{ matrix.arch }}.tgz -C dist engine-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: engine-${{ matrix.arch }}.tgz

  app:
    needs: engine
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: engine-*, merge-multiple: true }
      - run: |
          mkdir -p dist
          for a in arm64 x64; do tar -xzf engine-$a.tgz -C dist; done
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          # Create the draft first: both arches finish together and would otherwise each make one.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "Ken for Mac ${GITHUB_REF_NAME#v}"
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          npx electron-builder --mac --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
