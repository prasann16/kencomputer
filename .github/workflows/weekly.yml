# Once a week: test updated dependencies and open a PR. After it merges and main's tests
# pass, tag the merged commit and prepare a release. Publishing stays a manual Mac check.
name: Weekly update
on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    concurrency: weekly-dependency-update
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: lock
        run: |
          uv pip compile requirements.in --universal --python-version 3.10 --no-header --upgrade -o requirements.txt -q
          git diff --quiet requirements.txt && echo "Nothing new this week." || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.lock.outputs.changed
        run: |
          # Every part must have a ready-made build for every kind of computer Ken runs on.
          for platform in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            MACOSX_DEPLOYMENT_TARGET=14.0 uv pip install -q --dry-run --only-binary :all: --python-platform "$platform" \
              --python-version 3.13 --target "$RUNNER_TEMP/dry" -r requirements.txt
          done
          uv venv -q --seed --managed-python --python 3.13 .venv
          uv pip install -q --python .venv/bin/python -r requirements.txt pytest pytest-asyncio pytest-aiohttp
          tests/check.sh
      - if: steps.lock.outputs.changed
        name: Open or update the dependency PR
        run: |
          branch=automation/weekly-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -q -m "Weekly update of Ken's parts" requirements.txt
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/weekly-pr.md"
          cat > "$body" <<'EOF'
          Updates Ken's locked dependencies. The dependency compatibility, unit, native-parts and desktop checks passed before this PR was opened.

          Approve the PR's workflow runs if GitHub asks, then review and merge through the normal checks. After merge, the weekly workflow waits for main's tests, tags the merged commit and starts a draft Mac release. Publishing still requires `desktop/check-release.sh <tag> --publish` on a Mac.
          EOF
          pr="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$body"
          else
            gh pr create --base main --head "$branch" --title "Weekly update of Ken's parts" --body-file "$body"
          fi

  release:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/weekly-update' &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: macos-15
    concurrency: release-preparation
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Wait for merged main checks
        timeout-minutes: 15
        run: bash .github/scripts/wait-for-main-tests.sh "$MERGED_SHA"
      - name: Tag the tested merge and start the release build
        run: |
          # Reuse this commit's tag on a retry. Never push main or tag an unmerged update.
          tag="$(python3 desktop/release_version.py stable)"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Ken for Mac ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          # GITHUB_TOKEN tag pushes do not trigger workflows; dispatch explicitly.
          gh workflow run release.yml --ref "$tag"
          body="$RUNNER_TEMP/weekly-release.md"
          cat > "$body" <<EOF
          The weekly dependency update was merged and main's tests passed.

          When the [release build](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml) finishes, publish it from a Mac:

              desktop/check-release.sh $tag --publish
          EOF
          gh issue create --title "Ken ${tag#v} is ready to publish" --body-file "$body"
