<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
  /* One look for every explainer. Change the palette only when the subject has its own colours
     (a brand, a real part: a green Raspberry Pi board, a grey jet). */
  :root {
    --paper: #F6F4EF;   /* background */
    --card: #FFFFFF;    /* things that sit on the paper */
    --ink: #15171C;     /* text and outlines */
    --muted: #5C6370;   /* secondary text */
    --rule: #D8D4CB;    /* hairlines, grid, inactive */
    --accent: #1D5FD1;  /* THE thing to look at. Use it in 1 to 3 places */
    --accent-soft: #DCE6F8;
    --warm: #D9841F;    /* a second idea only when there are two (input vs output, before vs after) */
    --warm-soft: #F7E6CC;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  main { width: 100%; height: 100%; padding: 72px 72px 64px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 32px; }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; max-width: 900px; text-wrap: balance; }
  .sub { margin-top: 16px; font-size: 30px; line-height: 1.35; color: var(--muted); max-width: 880px; text-wrap: pretty; }
  .fig { width: 100%; height: 100%; min-height: 0; display: block; overflow: visible; }
  footer { border-top: 2px solid var(--rule); padding-top: 24px; min-height: 107px; font-size: 30px; line-height: 1.35; text-wrap: pretty; }
  footer b { font-weight: 600; color: var(--accent); }

  /* SVG vocabulary. Text sizes are in px at 1080 wide: on a phone screen 32 px reads like 12 pt. */
  svg text { font-family: var(--sans); fill: var(--ink); }
  .label { font-size: 32px; font-weight: 600; }
  .text  { font-size: 28px; }
  .note  { font-size: 26px; fill: var(--muted); }
  .mono  { font-family: var(--mono); font-size: 28px; }
  .num   { font-family: var(--mono); font-size: 26px; font-weight: 600; fill: #fff; }
  .box   { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .box.soft { fill: var(--accent-soft); stroke: var(--accent); }
  .box.warm { fill: var(--warm-soft); stroke: var(--warm); }
  .line  { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .line.accent { stroke: var(--accent); stroke-width: 5; }
  .line.dash { stroke: var(--muted); stroke-dasharray: 8 10; stroke-width: 2.5; }
  .arrow { marker-end: url(#arrow); }
  .arrow.accent { marker-end: url(#arrow-accent); }
  .dot   { fill: var(--accent); }
  .hit   { fill: var(--accent); }

  /* Steps. Tag parts with data-step="N" (they appear from step N on) and step captions with data-only="N"
     (shown only in step N). data-full is shown only in the full picture. render.py --steps draws
     visual.png (everything) plus step-1.png ... and steps.mp4. */
  body.stepping [data-full] { display: none; }
  body:not(.stepping) [data-only] { display: none; }
  body.stepping [data-step].later, body.stepping [data-only].other { display: none; }
  body.stepping [data-step].past { opacity: .38; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Title says the answer in a few words</h1>
    <p class="sub">One plain sentence on how it works.</p>
  </header>

  <!-- The figure. viewBox is 936 wide (the frame minus its margins) and about 880 tall with a 2 line title,
       subtitle and footer; keep everything inside it. -->
  <svg class="fig" viewBox="0 0 936 880" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
    </defs>
    <!-- replace from here -->
    <g data-step="1">
      <rect class="box" x="40" y="380" width="240" height="160" rx="12"/>
      <text class="label" x="160" y="470" text-anchor="middle">Input</text>
    </g>
    <g data-step="2">
      <path class="line arrow" d="M290,460 H640"/>
      <rect class="box soft" x="656" y="380" width="240" height="160" rx="12"/>
      <text class="label" x="776" y="470" text-anchor="middle">Output</text>
    </g>
    <!-- to here -->
  </svg>

  <footer>
    <p data-full><b>The takeaway</b> in one line.</p>
    <p data-only="1"><b>1.</b> What happens first.</p>
    <p data-only="2"><b>2.</b> What happens next.</p>
  </footer>
</main>
<script>
  // #step=N (render.py --steps) shows the picture as it is at step N: earlier parts dimmed, later ones hidden.
  const m = location.hash.match(/step=(\d+)/);
  if (m) {
    const n = +m[1];
    document.body.classList.add("stepping");
    document.querySelectorAll("[data-step]").forEach(el => {
      const s = +el.dataset.step;
      el.classList.toggle("later", s > n);
      el.classList.toggle("past", s < n && !el.hasAttribute("data-keep"));
    });
    document.querySelectorAll("[data-only]").forEach(el => el.classList.toggle("other", +el.dataset.only !== n));
  }
</script>
</body>
</html>
